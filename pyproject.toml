[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bpl-pc-experiments"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools]
py-modules = ["pc_model", "pc_experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["pc_model.py", "pc_experiments.py", "test_pc_model.py", "test_pc_experiments.py"]
typeCheckingMode = "basic"
